[build]
  publish = "static"
  functions = "netlify/functions"
  # No build command — static/ is served as-is, and Netlify auto-bundles the
  # function(s) in netlify/functions/ with esbuild after running `npm install`
  # for the dependencies declared in package.json (e.g. @netlify/blobs).

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
